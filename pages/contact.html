<head>
    <title>Contact – Optique et Audition Wave</title>
    <meta charset="utf-8">

    <meta name="description" content="Contactez Optique et Audition Wave : 49 rue de Trévise, 75009 Paris.">
    <meta property="og:title" content="Contact – Optique et Audition Wave">
    <meta property="og:description" content="Contactez Optique et Audition Wave : 49 rue de Trévise, 75009 Paris.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="../images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" >
</head>

<body>
    <header id="header">
        <a href="../index.html"><img class="logo" src="../images/logo.png" alt="Logo"></a>
        <button class="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="menu"><i class="fas fa-bars" aria-hidden="true"></i></button>
        <nav class="menu" id="menu">
            <ul>
                <li><a href="optique.html">Optique</a></li>
                <li><a href="audition.html">Audition</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    
    </header>
    <main>
        <section class="contact-section">
            <h1>Contactez-nous</h1>
            <p>Remplissez le formulaire ci-dessous et nous vous répondrons dès que possible.</p>
    
            <form id="contactForm">
                <label for="name">Nom complet:</label>
                <input type="text" id="name" name="name" required>
    
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
    
                <label for="subject">Sujet:</label>
                <input type="text" id="subject" name="subject" required>
    
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
    
                <button type="submit">Envoyer</button>
            </form>
    
            <p id="statusMessage"></p>
        </section>

        <section class="contener2 find-us">
            <div class="section1">
                <h2>Nous trouver</h2>
                <p><i class="fas fa-location-dot" aria-hidden="true"></i> 49 rue de Trévise<br>75009 Paris</p>
            </div>
            <iframe title="Plan d'accès" loading="lazy"
                src="https://www.google.com/maps?q=49+rue+de+Trevise+75009+Paris&output=embed"></iframe>
        </section>
    </main>
 
    <footer>
        <p>Optique et Audition Wave · 49 rue de Trévise, 75009 Paris</p>
        <div id="icons">
            <a href="https://www.instagram.com/ton_compte" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="mailto:ton.email@example.com" aria-label="Envoyer un email"><i class="fas fa-envelope"></i></a>
            <a href="https://www.linkedin.com/in/ton-profile" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
        </div>
    </footer>
    <script src="../js/main.js"></script>
    <script src="../js/contact.js"></script>
</body>


</html>
