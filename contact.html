<!DOCTYPE html>
<html lang="fr">

<head>
    <title>Optique wave</title>
    <meta charset="utf8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" >
</head>

<body>
    <header id="header">
        <a href="index.html"><img class="logo" src="logo.png" alt="Logo"></a>
        <nav class="menu">
            <ul>
                <li><a href="optique.html">Optique</a></li>
                <li><a href="audition.html">Audition</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    
    </header>
    <main>
        <section class="contact-section">
            <h2>Contactez-nous</h2>
            <p>Remplissez le formulaire ci-dessous et nous vous répondrons dès que possible.</p>
    
            <form id="contactForm">
                <label for="name">Nom complet:</label>
                <input type="text" id="name" name="name" required>
    
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
    
                <label for="subject">Sujet:</label>
                <input type="text" id="subject" name="subject" required>
    
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
    
                <button type="submit">Envoyer</button>
            </form>
    
            <p id="statusMessage"></p>
        </section>
    </main>
 
</body>


</html>
